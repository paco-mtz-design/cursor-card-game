<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>⚔ Tacticlash — Interactive Manual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          },
        },
      },
    };
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: #F7F5F0;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }
    .display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-feature-settings: 'ss01' on; }

    @keyframes stepFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .step-fade { animation: stepFadeIn .45s cubic-bezier(.2,.7,.2,1) both; }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(16px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-enter { animation: cardEnter .55s cubic-bezier(.2,.7,.2,1) both; }

    .hover-card { transition: transform .25s cubic-bezier(.2,.7,.2,1); }
    .hover-card:hover { transform: translateY(-4px); }

    .hover-bestiary { transition: transform .35s cubic-bezier(.2,.7,.2,1); }
    .hover-bestiary:hover { transform: translateY(-8px) rotate(0deg) !important; z-index: 2; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="tacticlash-card.jsx"></script>
  <script type="text/babel" src="manual-nav.jsx"></script>
  <script type="text/babel" src="manual-app.jsx"></script>
</body>
</html>
