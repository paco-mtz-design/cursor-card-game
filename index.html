<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tacticlash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Tacticlash</h1>
    <div class="header__turn" id="turn-banner" hidden>
      <span class="turn-banner__label" id="turn-label">Player 1's turn</span>
      <span class="turn-banner__step" id="turn-step"></span>
    </div>
    <div class="game-over" id="game-over" hidden aria-live="polite">
      <p class="game-over__message" id="game-over-message"></p>
    </div>
    <button type="button" class="btn btn-new-game" id="btn-new-game">New game</button>
  </header>

  <main class="game">
    <!-- Setup overlay: shown during New Game flow -->
    <div class="setup" id="setup" aria-live="polite" hidden>
      <div class="setup__step setup__step--goal" id="setup-goal">
        <p class="setup__title">Choose capture goal</p>
        <div class="setup__actions">
          <button type="button" class="btn btn--goal" data-goal="10">10 captures</button>
          <button type="button" class="btn btn--goal" data-goal="15">15 captures</button>
        </div>
      </div>
      <div class="setup__step setup__step--coin" id="setup-coin" hidden>
        <p class="setup__title">Who goes first?</p>
        <button type="button" class="btn" id="btn-flip-coin">Flip coin</button>
        <p class="setup__result" id="coin-result" hidden></p>
        <button type="button" class="btn" id="btn-after-coin" hidden>Continue</button>
      </div>
      <div class="setup__step setup__step--place" id="setup-place" hidden>
        <p class="setup__title" id="place-title">Player 1: Place your units</p>
        <p class="setup__hint" id="place-hint">Click a unit below, then click an empty slot on your row.</p>
        <div class="setup__place-actions">
          <button type="button" class="btn btn--secondary" id="btn-place-randomly">Place all randomly</button>
        </div>
        <div class="setup__hand" id="placement-hand" role="list"></div>
      </div>
    </div>

    <!-- Board container: left (tarot) | center (hands + board) | right (decks, score, debug) -->
    <div class="board-container" id="board-container">
      <aside class="board__left" aria-label="Tarot cards">
        <div class="tarot-strip" id="tarot-strip" aria-hidden="true">
          <div class="tarot-placeholder"></div>
          <div class="tarot-placeholder"></div>
          <div class="tarot-placeholder"></div>
        </div>
      </aside>

      <div class="board__center">
        <!-- Opponent item hand (top); shown when playing -->
        <section class="item-hand item-hand--opponent" id="item-hands-p2" hidden aria-label="Player 2 item hand">
          <div class="item-hand__list" id="item-hand-p2" role="list"></div>
        </section>

        <!-- Score + battlefield + action strip + player hand -->
        <div class="captures" id="captures" hidden aria-label="Capture counts">
          <span>P1: <strong id="captures-p1">0</strong>/<span id="capture-goal-el">15</span></span>
          <span>P2: <strong id="captures-p2">0</strong>/<span id="capture-goal-el-2">15</span></span>
        </div>

        <div class="board" aria-label="Battlefield">
          <div class="row row--player2" aria-label="Player 2 units">
            <div class="slot" data-player="2" data-column="0" tabindex="0"></div>
            <div class="slot" data-player="2" data-column="1" tabindex="0"></div>
            <div class="slot" data-player="2" data-column="2" tabindex="0"></div>
            <div class="slot" data-player="2" data-column="3" tabindex="0"></div>
            <div class="slot" data-player="2" data-column="4" tabindex="0"></div>
          </div>
          <div class="row row--player1" aria-label="Player 1 units">
            <div class="slot" data-player="1" data-column="0" tabindex="0"></div>
            <div class="slot" data-player="1" data-column="1" tabindex="0"></div>
            <div class="slot" data-player="1" data-column="2" tabindex="0"></div>
            <div class="slot" data-player="1" data-column="3" tabindex="0"></div>
            <div class="slot" data-player="1" data-column="4" tabindex="0"></div>
          </div>
        </div>

        <!-- Contextual action strip: move/attack/item buttons (shown when a unit is selected or during use items) -->
        <div class="action-strip" id="turn-actions" hidden aria-label="Turn actions">
          <button type="button" class="btn btn--small" id="btn-move-left">Move left</button>
          <button type="button" class="btn btn--small" id="btn-move-right">Move right</button>
          <button type="button" class="btn btn--small" id="btn-skip-move">Skip move</button>
          <button type="button" class="btn btn--small btn--secondary" id="btn-pass" hidden>Pass (cannot attack)</button>
          <button type="button" class="btn btn--small btn--secondary" id="btn-done-with-items" hidden>Done with items</button>
          <button type="button" class="btn btn--small" id="btn-wardstone-use" hidden>Use Wardstone</button>
          <button type="button" class="btn btn--small btn--secondary" id="btn-wardstone-no" hidden>No</button>
        </div>

        <!-- Player item hand (bottom); shown when playing -->
        <section class="item-hand item-hand--player" id="item-hands-p1" hidden aria-label="Player 1 item hand">
          <div class="item-hand__list" id="item-hand-p1" role="list"></div>
        </section>
      </div>

      <aside class="board__right" aria-label="Decks and score">
        <div class="score-markers score-markers--p2" id="score-markers-p2" aria-label="Player 2 captures">
          <!-- Filled/outline circles; populated by JS from captureGoal -->
        </div>
        <div class="deck-piles">
          <div class="deck-pile deck-pile--item-discard" id="discard-pile" hidden aria-label="Item discard pile">
            <h3 class="deck-pile__title">Item discard (<span id="discard-pile-count">0</span>)</h3>
            <button type="button" class="btn btn--small btn--secondary" id="btn-discard-toggle" aria-expanded="false">Show</button>
            <div class="deck-pile__stack deck-pile__stack--discard-list" id="discard-pile-list" hidden></div>
          </div>
          <div class="deck-pile deck-pile--items" id="items-deck" aria-label="Items deck">
            <div class="deck-pile__stack deck-pile__stack--back" id="items-deck-stack"></div>
          </div>
          <div class="deck-pile deck-pile--units" id="units-deck" aria-label="Units deck">
            <div class="deck-pile__stack deck-pile__stack--back" id="units-deck-stack"></div>
          </div>
          <div class="deck-pile deck-pile--unit-discard" id="units-discard-pile" aria-label="Units discard">
            <div class="deck-pile__stack deck-pile__stack--back" id="units-discard-stack"></div>
          </div>
        </div>
        <div class="score-markers score-markers--p1" id="score-markers-p1" aria-label="Player 1 captures"></div>
        <button type="button" class="btn btn--debug" id="btn-debug-open" aria-label="Open debug controls">Debug controls</button>
      </aside>
    </div>

    <!-- Debug drawer: slides in from right; contains Game Log + item draw debug -->
    <div class="debug-drawer" id="debug-drawer" aria-hidden="true">
      <div class="debug-drawer__inner">
        <button type="button" class="btn debug-drawer__close" id="btn-debug-close" aria-label="Close">Close</button>
        <section class="game-log" id="game-log" aria-label="Game log">
          <h2 class="game-log__title">Game log</h2>
          <div class="game-log__entries" id="game-log-entries"></div>
        </section>
        <div class="item-hands__debug" id="item-draw-debug" hidden aria-label="Debug: replace last item draw">
          <span class="item-hands__debug-label">Item draw (debug):</span>
          <button type="button" class="btn btn--small btn--secondary" id="btn-replace-draw-with-pick">Replace with pick...</button>
          <div class="item-hands__pick-list-wrap" id="item-pick-list-wrap" hidden>
            <input type="text" class="item-hands__pick-list-search" id="item-pick-list-search" placeholder="Type to filter..." aria-label="Filter item list">
            <div class="item-hands__pick-list" id="item-pick-list"></div>
            <button type="button" class="btn btn--small btn--secondary item-hands__pick-list-close" id="btn-pick-list-close">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Unit zoom modal: click unit on board -->
    <div class="modal" id="unit-zoom-modal" role="dialog" aria-modal="true" aria-labelledby="unit-zoom-title" hidden>
      <div class="modal__backdrop" id="unit-zoom-backdrop"></div>
      <div class="modal__content modal__content--unit-zoom">
        <button type="button" class="modal__close" id="unit-zoom-close" aria-label="Close">×</button>
        <h2 class="modal__title" id="unit-zoom-title">Unit details</h2>
        <div class="unit-zoom__cards" id="unit-zoom-cards">
          <div class="unit-zoom__card-slot">
            <div class="unit-zoom__markers" id="unit-zoom-markers"></div>
            <div class="unit-zoom__img-wrap" id="unit-zoom-unit"></div>
            <span class="unit-zoom__label">Unit</span>
          </div>
          <div class="unit-zoom__card-slot">
            <div class="unit-zoom__img-wrap" id="unit-zoom-gear"></div>
            <span class="unit-zoom__label">Equipped gear</span>
          </div>
          <div class="unit-zoom__card-slot">
            <div class="unit-zoom__img-wrap" id="unit-zoom-terrain"></div>
            <span class="unit-zoom__label">Terrain</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Discard zoom modal: click discard pile -->
    <div class="modal" id="discard-zoom-modal" role="dialog" aria-modal="true" aria-labelledby="discard-zoom-title" hidden>
      <div class="modal__backdrop" id="discard-zoom-backdrop"></div>
      <div class="modal__content modal__content--discard-zoom">
        <button type="button" class="modal__close" id="discard-zoom-close" aria-label="Close">×</button>
        <h2 class="modal__title" id="discard-zoom-title">Discard pile</h2>
        <div class="discard-zoom__grid" id="discard-zoom-grid"></div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
